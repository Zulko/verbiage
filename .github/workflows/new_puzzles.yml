name: Create New Puzzles and Commit Changes

on:
  schedule:
    # 23:00 UTC every day (midnight in Paris during standard time).
    # Finish a batch queued for today, then submit tomorrow's batch.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-game-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install scripts/

      - name: Finish today's English puzzle and queue tomorrow
        id: en
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          TODAY=$(TZ=Europe/Paris date +%F)
          TOMORROW=$(TZ=Europe/Paris date -d tomorrow +%F)
          python scripts/game.py process-finished-batch --language en --date "$TODAY"
          process_status=$?
          python scripts/game.py launch-daily-batch --language en --date "$TOMORROW"
          launch_status=$?
          if [ "$process_status" -ne 0 ] || [ "$launch_status" -ne 0 ]; then
            exit 1
          fi

      - name: Finish today's French puzzle and queue tomorrow
        id: fr
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          TODAY=$(TZ=Europe/Paris date +%F)
          TOMORROW=$(TZ=Europe/Paris date -d tomorrow +%F)
          python scripts/game.py process-finished-batch --language fr --date "$TODAY"
          process_status=$?
          python scripts/game.py launch-daily-batch --language fr --date "$TOMORROW"
          launch_status=$?
          if [ "$process_status" -ne 0 ] || [ "$launch_status" -ne 0 ]; then
            exit 1
          fi

      - name: Commit and push puzzle files
        if: steps.en.outcome == 'success' || steps.fr.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add verbiage/public/puzzles verbiage/src/lib/puzzleCalendars.json verbiage/batch_queue
          if git diff --cached --quiet; then
            echo "No puzzle changes to commit"
            exit 0
          fi
          git commit -m "scheduled puzzle generation: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD
          # A GITHUB_TOKEN push does not trigger the Pages workflow.
          gh workflow run "Deploy static content to Pages" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if a language failed
        if: steps.en.outcome != 'success' || steps.fr.outcome != 'success'
        run: |
          echo "English: ${{ steps.en.outcome }}"
          echo "French: ${{ steps.fr.outcome }}"
          exit 1
