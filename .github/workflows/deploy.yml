# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_second.outputs.page_url || steps.deploy_final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "verbiage/package.json"
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: ./verbiage
      - name: Build
        run: npm run build
        working-directory: ./verbiage
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          # Upload dist folder from the verbiage directory
          path: "./verbiage/dist"
      # GitHub's internal artifact lookup can lag behind a successful upload.
      - name: Deploy to GitHub Pages
        id: deploy_first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying deployment
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 30
      - name: Retry deployment
        if: steps.deploy_first.outcome == 'failure'
        id: deploy_second
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final deployment attempt
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 60
      - name: Final deployment attempt
        if: steps.deploy_second.outcome == 'failure'
        id: deploy_final
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
